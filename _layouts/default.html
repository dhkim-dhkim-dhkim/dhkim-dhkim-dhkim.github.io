<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}
      {{ page.title }} | Donghyun Kim
    {% else %}
      Donghyun Kim
    {% endif %}
  </title>

  <meta
    name="description"
    content="Personal academic website of Donghyun Kim"
  >

  <link
    rel="stylesheet"
    href="{{ '/assets/css/style.css' | relative_url }}?v=20260808-4"
  >
</head>

<body>

  <header class="site-header">
    <div class="container nav-container">

      <a class="site-name" href="/">
        Donghyun Kim
      </a>

      <nav class="nav-links">

        <a
          href="/"
          {% if page.url == "/" %}
            class="active"
          {% endif %}
        >
          Home
        </a>

        <a
          href="/research/"
          {% if page.url == "/research/" %}
            class="active"
          {% endif %}
        >
          Research
        </a>

        <a
          href="/publications/"
          {% if page.url == "/publications/" %}
            class="active"
          {% endif %}
        >
          Publications
        </a>

        <a
          href="/Donghyun_Kim_CV.pdf"
          target="_blank"
          rel="noopener noreferrer"
        >
          CV
        </a>

        <a
          href="/personal-interests/"
          {% if page.url == "/personal-interests/" %}
            class="active"
          {% endif %}
        >
          Personal Interests
        </a>

      </nav>

    </div>
  </header>


  <main class="container">
    {{ content }}
  </main>


  <footer class="site-footer">
    <div class="container">

      <p>
        © {{ site.time | date: "%Y" }} Donghyun Kim
      </p>

    </div>
  </footer>

</body>

</html>
